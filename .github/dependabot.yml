version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Roslyn reference pins the minimum compiler version consumers need;
      # it is bumped deliberately, not chased to latest.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  # The Restate server image referenced by docker-compose.yml at the repository root.
  # That file is the only place the pin is written: RestateBuilder.RestateImage and
  # .github/scripts/integration-test.sh derive from it, so a bump needs no second edit.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
