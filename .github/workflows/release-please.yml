name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Tags created with the default GITHUB_TOKEN do not trigger `on: push: tags`
          # workflows, so the step below dispatches publish.yml itself. A
          # RELEASE_PLEASE_TOKEN PAT secret stays optional: with one the tag push also
          # triggers publish.yml, and its `--skip-duplicate` push keeps the two runs from
          # fighting over the package.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # workflow_dispatch is one of the two events GitHub lets the default token raise, so
      # this is what gets a tagged release onto NuGet without a personal access token.
      - name: Publish the release to NuGet
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "Dispatching publish.yml on $TAG."
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

      # The action only reports a pull request when it creates or updates one, so a commit that
      # leaves the release pull request unchanged (a `ci:` or `chore:` subject, say) reports
      # nothing. Fall back to looking the open release pull request up, so the roll below runs
      # whenever one is waiting to be merged.
      #
      # The raw output is read inside `run:` rather than in an expression: GitHub evaluates a
      # step's `env:` even when its `if:` is false, and `fromJson` on the empty output fails the
      # whole workflow.
      - name: Find the open release pull request
        id: release-pr
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          branch=""
          if [ -n "$PR_JSON" ]; then
            branch="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // ""')"
          fi

          if [ -z "$branch" ]; then
            branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" \
              --state open --json headRefName --jq '.[0].headRefName // ""')"
          fi

          if [ -z "$branch" ]; then
            echo "No open release pull request: nothing to roll."
          else
            echo "Rolling public API entries onto $branch."
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The release PR already carries the version and changelog change, so the public API
      # roll belongs in the same reviewable commit — and lands with the same merge.
      - uses: actions/checkout@v7
        if: steps.release-pr.outputs.branch
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Roll public API entries to shipped
        if: steps.release-pr.outputs.branch
        env:
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          .github/scripts/roll-public-api.sh

          if git diff --quiet; then
            echo "The release pull request already has every entry rolled."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: roll public API entries to shipped"
          git push origin "HEAD:$BRANCH"
