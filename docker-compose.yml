services:
  restate:
    # The pinned Restate server image, written down here and nowhere else: `docker compose up`
    # reads this file directly, and RestateBuilder.RestateImage, .github/scripts/integration-test.sh
    # and RestateImagePinTests all derive the pin from this line.
    image: docker.restate.dev/restatedev/restate:1.8
    container_name: restate-server
    ports:
      - "8080:8080"
      - "9070:9070"
    volumes:
      - restate-data:/restate-data

volumes:
  restate-data:
